[metadata]
name = ultraship-u2-mqtt
version = 1.0.0
description = Read a My Weigh UltraShip U-2 and publish its weight to MQTT
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/Hack42/giga-weight-watcher
license = BSD-2-Clause
license_files =
    LICENSE
    NOTICE
author = UltraShip U-2 MQTT contributors
classifiers =
    Development Status :: 5 - Production/Stable
    Environment :: Console
    Intended Audience :: Developers
    Operating System :: POSIX :: Linux
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Home Automation
    Topic :: System :: Hardware

[options]
py_modules =
    scale_mqtt
    ultraship_u2v2
python_requires = >=3.7
install_requires =
    paho-mqtt>=1.6,<2
    pyserial>=3,<4

[options.entry_points]
console_scripts =
    ultraship-u2-mqtt = scale_mqtt:main
    ultraship-u2-read = ultraship_u2v2:main
